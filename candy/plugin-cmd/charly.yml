plugin-cmd:
    candy:
        description: |-
            COMPILED-IN charly COMMAND-class plugin owning the externalized `charly cmd` command
            (#118 loader+check-tail cone) — run a single command in a running container with an
            optional desktop notification on completion.

            The plugin owns the command end to end: the kong grammar (CmdCmd), the container resolve
            (deploykit.ResolveContainer / ResolveSidecarContainer), and --notify (the venue's gdbus
            session-bus call, driven directly on the deploykit.ContainerChain executor — a plugin
            drives gdbus itself, the boundary law's host-object-is-never-permanence rule). The ONE
            thing it cannot do is the interactive exec, which is deploy-lifecycle machinery
            (dispatchLifecycleTarget → OpAttach): it dispatches the op="cmd" pod-lifecycle
            action over the reverse channel with INHERITED stdio, so the `-i` interactive
            stream reaches the operator. The former hidden `charly __cmd` core reentry is
            DELETED (K-wave 2) — the op="cmd" dispatch is plugin-side, so no charly-core symbol
            crosses the boundary; the plugin imports the sdk module alone.

            cmd is COMPILED-IN (listed in charly/charly.yml compiled_plugins) BECAUSE its
            Invoke(OpRun) needs the in-proc reverse channel — threaded by dispatchInProcCommand — to
            drive HostBuild("cli"). The out-of-process CliMain path has no reverse channel, so it
            errors. command:cmd is a FLAT command (Box + Command positionals), so NewMeta declares no
            Subcommands and ships no plugin_input.
        plugin:
            source: github.com/opencharly/plugin-cmd/candy/plugin-cmd
            providers:
                - command:cmd
        plan:
            - # ADE build-context check: the mandatory ≥1 deterministic check. Mirrors plugin-ssh /
              # plugin-check module-present — a trivial build-context `plugin: command` running `true`.
              # The live `charly cmd <box> <command>` interactive exec + notification needs a running
              # deployment, so it is exercised by the live check-commands-local bed roster.
              check: the cmd command plugin ships a buildable Go module (go.mod + the provider package) compiled into charly; the live `charly cmd` interactive exec + desktop notification is exercised against a running deployment by the bed roster
              id: cmd-module-present
              context:
                - build
              command: "true"

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
cmd-skill:
  skill:
    name: cmd
    family: core
    owner: plugin-cmd
